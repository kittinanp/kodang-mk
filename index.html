function toggleElecMode(){
  var m = val('rmEMode');
  byId('rmERate').disabled = (m === 'flat');
  byId('rmEFlat').disabled = (m !== 'flat');
}

function saveRoom(id){
  var rec = {
    id: id, name: val('rmName'), type: val('rmType'), floor: val('rmFloor'), size: val('rmSize'),
    rent: val('rmRent'), deposit: val('rmDep'),
    elecMode: val('rmEMode'), elecRate: val('rmERate'), elecMin: val('rmEMin'), elecFlat: val('rmEFlat'),
    waterMode: val('rmWMode'), waterRate: val('rmWRate'),
    internetFee: val('rmNet'), commonFee: val('rmCommon'),
    otherLabel: val('rmOLabel'), otherFee: val('rmOFee'),
    deviceId: val('rmDev'), status: val('rmStatus'), seq: val('rmSeq'), note: val('rmNote')
  };
  if (!s_(rec.name)){ toast('กรุณากรอกชื่อห้อง', 'err'); return; }
  go('api_saveRoom', [rec], { ok:'บันทึกห้องแล้ว' }).then(function(){ closeModal(); refresh(); });
}

function delRoom(id){

    go('api_deleteRoom', [id], { ok:'ลบแล้ว' }).then(function(){ closeAllModals(); refresh(); });
  }, 'ลบห้อง');
}

      kvRow('เงินประกันตามสัญญา', money(l.deposit) + ' บาท') +

function calcRefund(){
  var refund = (window.__eoDep || 0) - n_(val('eoDeduct')) - (window.__eoBal || 0);
  var el = byId('eoResult');
  if (!el) return;
  el.className = 'alert mt16 ' + (refund >= 0 ? 'ok' : 'err');
  el.innerHTML = refund >= 0
    ? 'ต้องคืนเงินประกันให้ผู้เช่า <b>' + money(refund) + ' บาท</b>'
    : 'ผู้เช่าต้องชำระเพิ่มอีก <b>' + money(-refund) + ' บาท</b>';
}

var meterYm = '';

function view_meters(){
  if (!meterYm) meterYm = ymAdd(thisYmStr(), -1);

  var rooms = (S.d.rooms || []).filter(function(r){ return s_(r.elecMode) !== 'flat' || s_(r.waterMode) === 'meter'; });

  var rows = rooms.map(function(r){
    var eRead = (S.d.readings || []).filter(function(x){
      return s_(x.roomId) === s_(r.id) && s_(x.ym) === meterYm && s_(x.type) === 'elec'; })[0];
    var prevRead = (S.d.readings || []).filter(function(x){
      return s_(x.roomId) === s_(r.id) && s_(x.type) === 'elec' && String(x.ym) < meterYm; })
      .sort(function(a,b){ return String(b.ym).localeCompare(String(a.ym)); })[0];
    var prev = eRead ? n_(eRead.prev) : (prevRead ? n_(prevRead.curr) : 0);

    var dev = (S.d.devices || []).filter(function(d){ return s_(d.deviceId) === s_(r.deviceId); })[0];
    var wMeter = s_(r.waterMode) === 'meter';
    var wRead = wMeter ? (S.d.readings || []).filter(function(x){
      return s_(x.roomId) === s_(r.id) && s_(x.ym) === meterYm && s_(x.type) === 'water'; })[0] : null;
    var wPrevRead = wMeter ? (S.d.readings || []).filter(function(x){
      return s_(x.roomId) === s_(r.id) && s_(x.type) === 'water' && String(x.ym) < meterYm; })
      .sort(function(a,b){ return String(b.ym).localeCompare(String(a.ym)); })[0] : null;
    var wPrev = wRead ? n_(wRead.prev) : (wPrevRead ? n_(wPrevRead.curr) : 0);

    return '<tr>' +
      '<td><b>' + esc(r.name) + '</b>' +
        (dev ? '<div class="xsmall ' + (dev.online ? '' : 'muted') + '">' +
          (dev.online ? '📡 ' + num(dev.lastKwh) + ' kWh' : '○ อุปกรณ์ออฟไลน์') + '</div>' : '') + '</td>' +
      '<td class="mono muted">' + num(prev) + '</td>' +
      '<td><input type="number" step="0.01" class="mtIn" data-room="' + esc(r.id) + '" data-type="elec" ' +
        'data-prev="' + prev + '" value="' + (eRead ? n_(eRead.curr) : '') + '" ' +
        'oninput="mtCalc(this)" placeholder="เลขมิเตอร์"></td>' +
      '<td class="right mono bold" id="u_' + esc(r.id) + '_elec">' + (eRead ? num(eRead.units) : '-') + '</td>' +
      '<td class="right mono" id="m_' + esc(r.id) + '_elec">' +
        (eRead ? money(n_(eRead.units) * n_(r.elecRate)) : '-') + '</td>' +
      (wMeter
        ? '<td class="mono muted">' + num(wPrev) + '</td>' +
          '<td><input type="number" step="0.01" class="mtIn" data-room="' + esc(r.id) + '" data-type="water" ' +
            'data-prev="' + wPrev + '" value="' + (wRead ? n_(wRead.curr) : '') + '" oninput="mtCalc(this)"></td>' +
          '<td class="right mono bold" id="u_' + esc(r.id) + '_water">' + (wRead ? num(wRead.units) : '-') + '</td>'
        : '<td colspan="3" class="small muted">' + esc(WATER_MODE[s_(r.waterMode)]) + '</td>') +
      '</tr>';
  }).join('');

  var anyWaterMeter = rooms.some(function(r){ return s_(r.waterMode) === 'meter'; });

  return '<div class="card"><div class="hd">' +
    '<h3>จดมิเตอร์</h3><div class="spacer"></div>' +
    '<select id="mtYm" onchange="meterYm=this.value;renderView()" style="width:auto">' + ymOptions(meterYm) + '</select>' +
    '<button class="btn sm" onclick="pullIot()">📡 ดึงจากมิเตอร์ IoT</button>' +
    '<button class="btn primary sm" onclick="saveMeters()">บันทึกทั้งหมด</button>' +
    '</div><div class="bd tight">' +
    '<div class="alert info" style="border-radius:0">กรอกเฉพาะ "เลขครั้งนี้" — ระบบคิดจำนวนหน่วยและเลขครั้งก่อนให้อัตโนมัติ</div>' +
    '<div class="tableWrap"><table><thead><tr>' +
    '<th>ห้อง</th><th>ไฟ: ครั้งก่อน</th><th style="min-width:130px">ไฟ: ครั้งนี้</th><th class="right">หน่วย</th><th class="right">เป็นเงิน</th>' +
    (anyWaterMeter ? '<th>น้ำ: ครั้งก่อน</th><th style="min-width:120px">น้ำ: ครั้งนี้</th><th class="right">หน่วย</th>' : '<th colspan="3">ค่าน้ำ</th>') +
    '</tr></thead><tbody>' + (rows || '<tr><td colspan="8">' + emptyBox('⚡','ไม่มีห้องที่ต้องจดมิเตอร์') + '</td></tr>') +
    '</tbody></table></div></div></div>';
}

function mtCalc(el){
  var prev = n_(el.getAttribute('data-prev'));
  var room = el.getAttribute('data-room');
  var type = el.getAttribute('data-type');
  var curr = n_(el.value);
  var units = curr - prev;
  if (units < 0) units = curr;
  var uEl = byId('u_' + room + '_' + type);
  if (uEl) uEl.textContent = el.value === '' ? '-' : num(units);
  if (type === 'elec'){
    var r = roomOf(room);
    var mEl = byId('m_' + room + '_elec');
    if (mEl && r) mEl.textContent = el.value === '' ? '-' : money(units * n_(r.elecRate));
  }
}

function saveMeters(){
  var list = [];
  var inputs = document.querySelectorAll('.mtIn');
  for (var i = 0; i < inputs.length; i++){
    var el = inputs[i];
    if (el.value === '') continue;
    list.push({
      roomId: el.getAttribute('data-room'), ym: meterYm, type: el.getAttribute('data-type'),
      prev: el.getAttribute('data-prev'), curr: el.value, source: 'manual'
    });
  }
  if (!list.length){ toast('ยังไม่ได้กรอกเลขมิเตอร์', 'err'); return; }
  go('api_saveReadings', [list], { ok:'บันทึกมิเตอร์ ' + list.length + ' รายการแล้ว' }).then(function(){ refresh(); });
}

function pullIot(){
  go('api_pullIotReadings', [meterYm]).then(function(r){
    toast(r.saved ? 'ดึงข้อมูลจากมิเตอร์ ' + r.saved + ' ห้องแล้ว' : 'ไม่พบข้อมูลจากอุปกรณ์', r.saved ? 'ok' : 'err');
    refresh();
  });
}

function collectExtras(){
  var out = [];
  var labels = document.querySelectorAll('.exLabel');
  var amounts = document.querySelectorAll('.exAmount');
  for (var i = 0; i < labels.length; i++){
    if (!s_(labels[i].value) || !n_(amounts[i].value)) continue;
    out.push({ label: labels[i].value, amount: amounts[i].value, kind: 'other', qty: 1 });

  go('api_savePayment', [{

      go('api_confirmPayment', [id, false, reason], { ok:'ปฏิเสธแล้ว' }).then(function(){ refresh(); });
    });
  }
}

        statBox('รายจ่ายรวม', money0(r.total.expense), '', 'w') +

        statBox('ออกบิลรวม', money0(r.total.billed), '', '') +
      '</div>' +

      '<div class="card mb16"><div class="hd"><h3>รายรับ-รายจ่ายรายเดือน</h3><div class="spacer"></div>' +
      '<button class="btn sm" onclick="exportSheet(\'Invoices\')">ส่งออก CSV</button></div>' +
      '<div class="bd tight"><div class="tableWrap"><table><thead><tr>' +
      '<th>เดือน</th><th class="right">ออกบิล</th><th class="right">เก็บได้</th><th class="right">รายจ่าย</th>' +
      '<th class="right">คงเหลือ</th><th class="right">ค้างชำระ</th><th class="center">เข้าพัก</th>' +
      '</tr></thead><tbody>' + r.rows.map(function(x){
        return '<tr><td>' + esc(x.ymText) + '</td>' +
          '<td class="right mono">' + money0(x.billed) + '</td>' +
          '<td class="right mono" style="color:var(--success)">' + money0(x.collected) + '</td>' +
          '<td class="right mono" style="color:var(--warn)">' + money0(x.expense) + '</td>' +
          '<td class="right mono bold">' + money0(x.net) + '</td>' +
          '<td class="right mono" style="color:' + (x.outstanding > 0 ? 'var(--danger)' : 'inherit') + '">' +
            money0(x.outstanding) + '</td>' +
          '<td class="center small">' + x.occupied + ' ห้อง (' + x.occupancy + '%)</td></tr>';
      }).join('') + '</tbody></table></div></div></div>';

    if (r.debtors.length){
      html += '<div class="card mb16"><div class="hd"><h3>🔴 ลูกหนี้ค้างชำระ</h3></div><div class="bd tight">' +
        '<table><tbody>' + r.debtors.map(function(d){
          return '<tr><td><b>' + esc(d.room) + '</b></td>' +
            '<td class="small muted">ค้าง ' + d.months.map(ymShort).join(', ') + '</td>' +
            '<td class="right mono bold" style="color:var(--danger)">' + money(d.balance) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }

    var cats = Object.keys(r.byCategory);
    if (cats.length){
      var maxCat = 1;
      cats.forEach(function(c){ if (r.byCategory[c] > maxCat) maxCat = r.byCategory[c]; });
      html += '<div class="card mb16"><div class="hd"><h3>รายจ่ายแยกหมวด</h3></div><div class="bd">' +
        cats.sort(function(a,b){ return r.byCategory[b] - r.byCategory[a]; }).map(function(c){
          return '<div class="mb12"><div class="row" style="justify-content:space-between">' +
            '<span class="small">' + esc(c) + '</span><b class="mono">' + money0(r.byCategory[c]) + '</b></div>' +
            '<div class="bar mt8"><i style="width:' + (r.byCategory[c]/maxCat*100) + '%"></i></div></div>';
        }).join('') + '</div></div>';
    }

    html += '<div class="card"><div class="hd"><h3>การใช้ไฟรายห้อง (หน่วย)</h3></div><div class="bd tight">' +
      '<div class="tableWrap"><table><thead><tr><th>ห้อง</th>' +
      u.ymList.map(function(y){ return '<th class="right">' + ymShort(y) + '</th>'; }).join('') +
      '<th class="right">เฉลี่ย</th></tr></thead><tbody>' +
      u.rows.map(function(x){
        return '<tr><td><b>' + esc(x.room) + '</b>' +
          (x.spike ? ' <span class="tag r">ใช้ไฟสูงผิดปกติ</span>' : '') + '</td>' +
          x.cells.map(function(c){ return '<td class="right mono">' + (c === null ? '-' : num(c)) + '</td>'; }).join('') +
          '<td class="right mono muted">' + num(x.avg) + '</td></tr>';
      }).join('') + '</tbody></table></div></div></div>';

    el.innerHTML = html;
  }).catch(function(e){
    var el = byId('repArea');
    if (el) el.innerHTML = '<div class="alert err">' + esc(e.message) + '</div>';
  });
}

function exportSheet(name){
  go('api_exportCsv', [name]).then(function(r){ downloadText(r.name, r.csv); });
}

function openUserForm(email){
  var u = email ? (S.d.users || []).filter(function(x){ return s_(x.email) === s_(email); })[0] : null;
  openModal({
    title: email ? 'แก้ไขผู้ใช้' : 'เพิ่มผู้ใช้', size: 'narrow', dismissable: false,
    body: fld('อีเมล', '<input type="email" id="usEmail" value="' + esc(u ? u.email : '') + '"' +
        (u ? ' readonly' : '') + '>') +
      fld('ชื่อ', '<input type="text" id="usName" value="' + esc(u ? u.name : '') + '">', 'mt12') +
      '<div class="grid g2 mt12">' +
      fld('บทบาท', '<select id="usRole" onchange="byId(\'usTenantWrap\').style.display=this.value===\'tenant\'?\'block\':\'none\'">' +
        '<option value="admin"' + (u && s_(u.role) === 'admin' ? ' selected' : '') + '>ผู้ดูแล</option>' +
        '<option value="owner"' + (u && s_(u.role) === 'owner' ? ' selected' : '') + '>เจ้าของ</option>' +
        '<option value="tenant"' + (u && s_(u.role) === 'tenant' ? ' selected' : '') + '>ผู้เช่า</option></select>') +
      fld('โทรศัพท์', '<input type="tel" id="usPhone" value="' + esc(u ? u.phone : '') + '">') +
      '</div>' +
      '<div id="usTenantWrap" style="display:' + (u && s_(u.role) === 'tenant' ? 'block' : 'none') + '" class="mt12">' +
        fld('ผูกกับผู้เช่า', '<select id="usTenant">' + tenantOptions(u ? u.tenantId : '') + '</select>') + '</div>' +
      '<label class="check mt12"><input type="checkbox" id="usActive"' +
        (!u || String(u.active) === 'true' ? ' checked' : '') + '> เปิดให้เข้าใช้ระบบ</label>' +
      (!email ? '<label class="check mt8"><input type="checkbox" id="usMail" checked> ส่งอีเมลเชิญเข้าระบบ</label>' : '') +
      (email ? '<button class="btn sm mt16" onclick="revokeSessions(\'' + esc(email) + '\')">บังคับออกจากระบบทุกอุปกรณ์</button>' : ''),
    footer: (email ? '<button class="btn danger" onclick="delUser(\'' + esc(email) + '\')">ลบผู้ใช้</button><div class="spacer"></div>' : '') +
      '<button class="btn" onclick="closeModal()">ยกเลิก</button>' +
      '<button class="btn primary" onclick="saveUser()">บันทึก</button>'
  });
}

function saveUser(){

function previewQR(){
  var el = byId('qrPreview');
  if (!el) return;
  var id = val('stPP');
  if (!s_(id)){ el.innerHTML = '<div class="small muted">กรอกพร้อมเพย์เพื่อดูตัวอย่าง QR</div>'; return; }
  try {
    el.innerHTML = QR.svg(promptpayPayload(id, 1234.56), { px: 150 }) +
      '<div class="xsmall muted mt8">ตัวอย่าง QR ยอด 1,234.56 บาท<br>ลองสแกนด้วยแอปธนาคารเพื่อตรวจสอบ</div>';
  } catch(e){
    el.innerHTML = '<div class="small" style="color:var(--danger)">สร้าง QR ไม่ได้: ' + esc(e.message) + '</div>';
  }
}

function saveSettings(){
  var map = {
    dormName: val('stName'), dormAddress: val('stAddr'), dormPhone: val('stPhone'), taxId: val('stTax'), contactLine: val('stLine'),
    promptpayId: val('stPP'), promptpayName: val('stPPName'),

<script>
// ===================================================================
// views_tenant — หน้าจอฝั่งผู้เช่า (เห็นเฉพาะข้อมูลห้องตัวเอง)
// ===================================================================

function myRoom(){
  return (S.d.rooms && S.d.rooms.length) ? S.d.rooms[0] : null;
}
function myLease(){
  var list = (S.d.leases || []).filter(function(l){ return s_(l.status) !== 'ended'; });
  list.sort(function(a,b){ return String(b.startDate).localeCompare(String(a.startDate)); });
  return list[0] || (S.d.leases || [])[0] || null;
}
function myUnpaid(){
  return (S.d.invoices || []).filter(function(v){ return n_(v.balance) > 0.5 && s_(v.status) !== 'void'; });
}

// -------------------------------------------------------------------
// ห้องของฉัน
// -------------------------------------------------------------------
function view_tHome(){
  var r = myRoom(), l = myLease();
  if (!r){
    return emptyBox('🏠','ยังไม่ได้ผูกห้องกับบัญชีนี้','กรุณาติดต่อผู้ดูแลโกดังเพื่อผูกห้อง');
  }

  var unpaid = myUnpaid();
  var totalDue = 0;
  unpaid.forEach(function(v){ totalDue += n_(v.balance); });
  var next = unpaid.sort(function(a,b){ return String(a.dueDate).localeCompare(String(b.dueDate)); })[0];

  var lastRead = (S.d.readings || []).filter(function(x){ return s_(x.type) === 'elec'; })
    .sort(function(a,b){ return String(b.ym).localeCompare(String(a.ym)); })[0];

  var html = '';

  if (totalDue > 0.5 && next){
    var left = daysDiff(todayStr(), next.dueDate);
    html += '<div class="card mb16" style="border-color:' + (left < 0 ? 'var(--danger)' : 'var(--primary)') + '">' +
      '<div class="bd">' +
      '<div class="row wrap" style="justify-content:space-between;align-items:flex-start">' +
        '<div><div class="muted small">ยอดที่ต้องชำระ</div>' +
        '<div style="font-size:33px;font-weight:800;letter-spacing:-.02em;line-height:1.2" class="mono">' +
          money(totalDue) + ' <span style="font-size:17px">บาท</span></div>' +
        '<div class="small mt8">' + (left < 0
          ? '<span style="color:var(--danger)">⏰ เกินกำหนดชำระมาแล้ว ' + (-left) + ' วัน</span>'
          : left === 0 ? '<span style="color:var(--warn)">ครบกำหนดวันนี้</span>'
          : 'ครบกำหนด ' + dateFull(next.dueDate) + ' (อีก ' + left + ' วัน)') + '</div></div>' +
        '<button class="btn primary lg" onclick="openTenantPay(\'' + esc(next.id) + '\')">แจ้งชำระเงิน</button>' +
      '</div></div></div>';
  } else {
    html += '<div class="alert ok mb16">✓ ไม่มียอดค้างชำระ ขอบคุณครับ/ค่ะ</div>';
  }

  html += '<div class="grid g2 mb16">' +
    '<div class="card"><div class="hd"><h3>ข้อมูลห้อง</h3></div><div class="bd"><div class="col">' +
      kvRow('ห้อง', s_(r.name)) +
      kvRow('ประเภท', s_(r.type) || '-') +
      kvRow('ค่าเช่า', money0(l ? l.rent : r.rent) + ' บาท/เดือน') +
      kvRow('ค่าไฟ', s_(r.elecMode) === 'flat'
        ? 'เหมาจ่าย ' + money0(r.elecFlat) + ' บาท'
        : num(r.elecRate) + ' บาท/หน่วย' + (s_(r.elecMode) === 'iot' ? ' (อ่านอัตโนมัติ)' : '')) +
      kvRow('ค่าน้ำ', (WATER_MODE[s_(r.waterMode)] || '') + ' ' + money0(r.waterRate) + ' บาท') +
      (n_(r.internetFee) ? kvRow('ค่าอินเทอร์เน็ต', money0(r.internetFee) + ' บาท/เดือน') : '') +
      (n_(r.commonFee) ? kvRow('ค่าส่วนกลาง', money0(r.commonFee) + ' บาท/เดือน') : '') +
    '</div></div></div>' +

    '<div class="card"><div class="hd"><h3>สัญญาเช่า</h3></div><div class="bd">' +
      (l ? '<div class="col">' +
        kvRow('เริ่มสัญญา', dateFull(l.startDate)) +
        kvRow('สิ้นสุดสัญญา', s_(l.endDate) ? dateFull(l.endDate) : 'ไม่กำหนด') +
        kvRow('เงินประกัน', money0(l.deposit) + ' บาท') +
        kvRow('ผู้ใช้พื้นที่', n_(l.occupants) + ' คน') +
        kvRow('ครบกำหนดชำระทุกวันที่', n_(l.dueDay)) +
        '</div>' +
        (s_(l.endDate) && daysDiff(todayStr(), l.endDate) <= 45 && daysDiff(todayStr(), l.endDate) >= 0
          ? '<div class="alert warn mt12">สัญญาจะครบกำหนดในอีก ' + daysDiff(todayStr(), l.endDate) +
            ' วัน หากต้องการต่อสัญญากรุณาติดต่อผู้ดูแล</div>' : '')
        : emptyBox('📄','ไม่พบข้อมูลสัญญา')) +
    '</div></div></div>';

  if (lastRead){
    html += '<div class="card mb16"><div class="hd"><h3>มิเตอร์ไฟล่าสุด</h3></div><div class="bd">' +
      '<div class="grid g3 keep">' +
      statBox('เดือน', ymShort(lastRead.ym), '', '') +
      statBox('หน่วยที่ใช้', num(lastRead.units), 'หน่วย', 'b') +
      statBox('เป็นเงิน', money0(n_(lastRead.units) * n_(r.elecRate)), 'บาท', 'w') +
      '</div>' +
      '<div class="small muted mt12">เลขมิเตอร์ ' + num(lastRead.prev) + ' → ' + num(lastRead.curr) +
        ' • จดเมื่อ ' + dateText(lastRead.readAt) + '</div>' +
      '</div></div>';
  }

  html += contactCard(true);

  // ทางลัดไปคู่มือ — บนมือถือเมนูคู่มืออยู่ใต้ปุ่ม "เพิ่มเติม" หาไม่ค่อยเจอ
  html += '<button class="btn block mt16 noPrint" onclick="nav(\'tHelp\')">' +
    '📖 ยังไม่รู้วิธีใช้? ดูคู่มือใช้งาน</button>';

  var pinned = (S.d.announcements || []).filter(function(a){ return String(a.pinned) === 'true'; });
  if (pinned.length){
    html += '<div class="card mt16"><div class="hd"><h3>📌 ประกาศสำคัญ</h3></div><div class="bd">' +
      pinned.map(function(a){
        return '<div class="mb12"><b>' + esc(a.title) + '</b>' +
          '<div class="small muted">' + dateText(a.date) + '</div>' +
          '<div class="mt8" style="white-space:pre-wrap">' + esc(a.body) + '</div></div>';
      }).join('') + '</div></div>';
  }

  return html;
}

// -------------------------------------------------------------------
// บิลและการชำระ
// -------------------------------------------------------------------
function view_tBills(){
  var invs = (S.d.invoices || []);
  var pending = (S.d.payments || []).filter(function(p){ return s_(p.status) === 'pending'; });

  var html = '';
  if (pending.length){
    html += '<div class="alert info mb16">⏳ มีรายการที่คุณแจ้งชำระแล้ว <b>' + pending.length + ' รายการ</b> ' +
      'อยู่ระหว่างรอผู้ดูแลตรวจสอบ</div>';
  }

  html += '<div class="card mb16"><div class="hd"><h3>บิลทั้งหมด</h3></div><div class="bd tight">' +
    '<div class="tableWrap"><table><thead><tr>' +
    '<th>เดือน</th><th>เลขที่</th><th>ครบกำหนด</th><th class="right">ยอดรวม</th>' +
    '<th class="right">คงเหลือ</th><th>สถานะ</th></tr></thead><tbody>' +
    (invs.map(function(v){
      return '<tr class="clickable" onclick="openInvoice(\'' + esc(v.id) + '\')">' +
        '<td><b>' + ymText(v.ym) + '</b></td>' +
        '<td class="small muted">' + esc(v.no) + '</td>' +
        '<td class="small">' + dateText(v.dueDate) + '</td>' +
        '<td class="right mono">' + money(v.total) + '</td>' +
        '<td class="right mono" style="color:' + (n_(v.balance) > 0.5 ? 'var(--danger)' : 'var(--success)') + '">' +

function view_tUsage(){
  var r = myRoom();
  if (!r) return emptyBox('⚡','ไม่มีข้อมูลห้อง');

  var reads = (S.d.readings || []).filter(function(x){ return s_(x.type) === 'elec'; })
    .sort(function(a,b){ return String(a.ym).localeCompare(String(b.ym)); });

  var maxU = 1;
  reads.forEach(function(x){ if (n_(x.units) > maxU) maxU = n_(x.units); });
  var avg = 0;
  if (reads.length){
    reads.forEach(function(x){ avg += n_(x.units); });
    avg = avg / reads.length;
  }
  var last = reads.length ? reads[reads.length - 1] : null;

  var html = '<div class="grid g3 keep mb16">' +
    statBox('เดือนล่าสุด', last ? num(last.units) : '-', last ? ymText(last.ym) + ' (หน่วย)' : '', 'b') +
    statBox('ค่าไฟล่าสุด', last ? money0(n_(last.units) * n_(r.elecRate)) : '-', 'บาท', 'w') +
    statBox('เฉลี่ยย้อนหลัง', num(avg), 'หน่วย/เดือน', '') +
    '</div>';

  if (last && avg > 0 && n_(last.units) > avg * 1.5){
    html += '<div class="alert warn mb16">⚠️ เดือนล่าสุดใช้ไฟสูงกว่าค่าเฉลี่ยของคุณมาก ' +
      'ลองตรวจสอบเครื่องใช้ไฟฟ้าที่เปิดทิ้งไว้ หรือแจ้งผู้ดูแลหากคิดว่าผิดปกติ</div>';
  }

  html += '<div class="card mb16"><div class="hd"><h3>หน่วยไฟที่ใช้รายเดือน</h3></div><div class="bd">' +
    (reads.length
      ? chartBars(
          reads.map(function(x){ return { label: ymShort(x.ym), values: [n_(x.units)] }; }),
          [{ name: 'หน่วยที่ใช้', color: 'var(--primary)' }],
          { height: 200, fmt: num }
        ) +
        '<div class="xsmall muted mt8">เฉลี่ยของคุณ ' + num(avg) + ' หน่วย/เดือน</div>'
      : emptyBox('⚡','ยังไม่มีข้อมูลมิเตอร์')) +
    '</div></div>';

  html += '<div class="card mb16"><div class="hd"><h3>ประวัติการจดมิเตอร์</h3></div><div class="bd tight">' +
    '<div class="tableWrap"><table><thead><tr><th>เดือน</th><th class="right">เลขครั้งก่อน</th>' +
    '<th class="right">เลขครั้งนี้</th><th class="right">หน่วยที่ใช้</th><th class="right">เป็นเงิน</th>' +
    '<th>ที่มา</th></tr></thead><tbody>' +
    reads.slice().reverse().map(function(x){
      return '<tr><td>' + ymText(x.ym) + '</td>' +
        '<td class="right mono muted">' + num(x.prev) + '</td>' +
        '<td class="right mono">' + num(x.curr) + '</td>' +
        '<td class="right mono bold">' + num(x.units) + '</td>' +
        '<td class="right mono">' + money(n_(x.units) * n_(r.elecRate)) + '</td>' +
        '<td>' + (s_(x.source) === 'iot' ? '<span class="tag b">อัตโนมัติ</span>' : '<span class="tag">จดมือ</span>') +
        '</td></tr>';
    }).join('') + '</tbody></table></div></div></div>';

  if ((S.d.usage || []).length){
    var u = S.d.usage;
    var maxD = 1;
    u.forEach(function(x){ if (n_(x.used) > maxD) maxD = n_(x.used); });
    html += '<div class="card"><div class="hd"><h3>การใช้ไฟรายวัน (จากมิเตอร์อัตโนมัติ)</h3></div><div class="bd">' +
      '<div class="chart">' + u.map(function(x){
        return '<div class="b" style="height:' + Math.max(2, n_(x.used)/maxD*100) + '%" title="' +
          dateText(x.date) + ': ' + num(x.used) + ' หน่วย"></div>';
      }).join('') + '</div>' +
      '<div class="small muted mt8">' + dateText(u[0].date) + ' – ' + dateText(u[u.length-1].date) + '</div>' +
      '</div></div>';
  }

  return html;
}

        '<div class="mt12" style="white-space:pre-wrap">' + esc(a.body) + '</div>' +
        '</div></div>';
    }).join('') : emptyBox('📢','ยังไม่มีประกาศ')) + '</div></div>';

  return html;
}
</script>
